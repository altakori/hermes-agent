name: persistent-safety-guard
version: "0.1.0"
description: "Opt-in append-only safety ledger and high-confidence MCP argument egress guard."
author: "NousResearch"
provides_hooks:
  - on_session_start
  - pre_llm_call
  - pre_tool_call
  - subagent_start
config_schema:
  max_ledger_bytes:
    type: int
    default: 10485760
    description: "Maximum ledger size before writes fail closed"
